# clangd のユーザー設定
# 参照場所: macOS は ~/Library/Preferences/clangd/config.yaml
#          Linux は ~/.config/clangd/config.yaml
# (このファイルを読むのは clangd のみ。Xcode は独自インデクサなので無関係)
#
# 下の If: PathMatch により、この設定は PlatformIO 関連のファイルを
# 編集しているときだけ有効になる。グローバルに置きつつ他の C/C++ プロジェクトへは
# 影響させないため。新規プロジェクトでも自動で効くので毎回 .clangd を置く必要はない。
#
# PathMatch は「絶対パスに対する正規表現」。~ は展開されない(書くと設定ごと無効になる)ので
# ホーム部分は .* で書く。こうするとユーザー名やマシンが変わっても、
# dotfiles を他機に持っていってもそのまま動く。
#
# なお ~/.platformio/ 配下(gd で飛んだ先のフレームワークのヘッダ)は
# 意図的に対象外にしている。それらは compile_commands.json の管轄外で
# clangd がフォールバックのコマンドを使うため、ツールチェインの -isystem が無く、
# そこで -nostdlibinc を効かせると stdio.h すら見つからなくなって逆効果になる。
If:
  PathMatch: .*/PlatformIO/.*

# PlatformIO の ESP32/Arduino ツールチェイン(gcc)は clang(d) が解釈できない
# GCC 専用フラグを付けてくるため、未知の引数エラーになる。
# それらを明示的に無視させることでエラーを解消している。
CompileFlags:
  Remove:
    - -fstrict-volatile-bitfields  # bitfield のvolatile扱いに関するGCC拡張（RISC-V/ESP32-C3系）
    - -fno-tree-switch-conversion  # switch文の最適化制御に関するGCC拡張（RISC-V/ESP32-C3系）
    - -mlongcalls               # Xtensa GCC専用の呼び出し規約フラグ（ESP32/S2/S3系）
    - -mdisable-hardware-atomics  # Xtensa GCC専用のアトミック命令制御フラグ（ESP32/S2/S3系）
  Add:
    # clangd は macOS ホスト向けに -isysroot .../MacOSX.sdk を勝手に注入する。
    # その結果 newlib の limits.h の #include_next が macOS SDK の machine/limits.h に
    # 到達し、__i386__/__arm64__ が未定義のため「#error architecture not supported」になる。
    # -nostdlibinc でホストの標準インクルードパスだけを外す。
    # --query-driver 由来のツールチェインのパス(-isystem)は残るので、
    # Xtensa / RISC-V どちらのESPボードでも正しく解決される。
    - -nostdlibinc
