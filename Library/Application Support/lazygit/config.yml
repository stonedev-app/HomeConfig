os:
  # e キーでファイルを開くときにnvim を使う
  editPreset: nvim
git:
  # 差分描画方法
  diffRenderers:
    # gitの色指定オプションを無効
    - colorArg: never
      # deltaを使用。配色プリセット指定、ページング無効、コード配色をNordに
      # 追加/削除行の背景色はtokyonightのDiffAdd/DiffDeleteと完全に同じ色
      # (green2/red1を25%の濃さで背景に混ぜた色。tokyonight本体のcolors.diffと同一)
      # 変更箇所の強調は、行の背景色を45%の濃さにして
      # 「同じ色のまま明るくする」方式（delta標準の挙動と同じ表現）
      command: >-
        delta --dark --paging=never --syntax-theme=Nord
        --minus-style="syntax #4b2a3d" --plus-style="syntax #2a4556"
        --minus-emph-style="syntax #6b2e43" --plus-emph-style="syntax #305f6f"
