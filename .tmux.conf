# prefixキー: Ctrl-b → Ctrl-a (screen方式、押しやすい)
set -g prefix C-a
# 旧prefixのC-bに残る古い割り当てを削除
unbind C-b
# Ctrl-aの行頭移動は、Ctrl-aを2回実施することで従来通り可能
bind-key C-a send-prefix

# マウス操作を有効化(ペイン切り替え・リサイズ・スクロールなど)
set -g mouse on

# ウィンドウ番号・ペイン番号を1から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じたら残りの番号を自動で詰める
set -g renumber-windows on

# コピーモードをvi風に(hjklで移動、vで選択、yでヤンク)
# 矩形選択をする際は、v(選択開始)に続けて、Ctrl-v 
# ヤンクした内容はシステムクリップボードへも送られる
setw -g mode-keys vi

# コピーモード: v で選択開始、y でヤンク
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

